name: Deploy lambdas
concurrency:
  group: deploy-lambdas
  cancel-in-progress: true

on:
  push:
    branches: ['master']
    paths: ['lambdas/**']
  workflow_dispatch:

env:
  AWS_REGION: eu-west-3

jobs:
  # On a push, only redeploy the lambda(s) whose files actually changed.
  # workflow_dispatch has no "before" commit to diff against, so a manual
  # run redeploys every function instead of relying on the filter.
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      functions: ${{ steps.set-output.outputs.functions }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            getSpotifyAccessToken:
              - 'lambdas/getSpotifyAccessToken/**'
            getAppleMusicDeveloperToken:
              - 'lambdas/getAppleMusicDeveloperToken/**'
      - id: set-output
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo 'functions=${{ steps.filter.outputs.changes }}' >> "$GITHUB_OUTPUT"
          else
            echo 'functions=["getSpotifyAccessToken","getAppleMusicDeveloperToken"]' >> "$GITHUB_OUTPUT"
          fi

  deploy-lambdas:
    runs-on: ubuntu-latest
    needs: ["detect-changes"]
    if: needs.detect-changes.outputs.functions != '[]'
    permissions:
      contents: read
    strategy:
      matrix:
        function: ${{ fromJSON(needs.detect-changes.outputs.functions) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        working-directory: lambdas/${{ matrix.function }}
        run: |
          if [ -f package.json ]; then npm install --omit=dev; fi
      - name: Zip function
        working-directory: lambdas/${{ matrix.function }}
        run: zip -r function.zip . -x "*.git*"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy to Lambda
        working-directory: lambdas/${{ matrix.function }}
        run: |
          aws lambda update-function-code \
            --function-name ${{ matrix.function }} \
            --zip-file fileb://function.zip
