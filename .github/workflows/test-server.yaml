name: Test server

on:
  pull_request:

jobs:
  test-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run server unit tests
        working-directory: server
        run: |
          npm ci && npm test
