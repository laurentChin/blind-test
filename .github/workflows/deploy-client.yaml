name: Deploy client
concurrency:
  group: deploy-client
  cancel-in-progress: true

on:
  push:
    branches: ['master']
    paths: ['client/**']
  workflow_dispatch:

jobs:
  run-client-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run client unit tests
        working-directory: client
        run: |
          CI=true yarn && yarn test

  build-client:
    runs-on: ubuntu-latest
    needs: ["run-client-tests"]
    steps:
      - uses: actions/checkout@v4
      - name: Build client
        working-directory: client
        run: |
          cat > .env <<ENVEOF
          REACT_APP_SPOTIFY_API_ENDPONT=${{ vars.SPOTIFY_API_ENDPONT }}
          REACT_APP_SPOTIFY_AUTHORIZE_ENDPOINT=${{ vars.SPOTIFY_AUTHORIZE_ENDPOINT }}
          REACT_APP_SPOTIFY_CLIENT_ID=${{ vars.SPOTIFY_CLIENT_ID }}
          REACT_APP_SPOTIFY_TOKEN_ENDPOINT=${{ vars.SPOTIFY_TOKEN_ENDPOINT }}
          REACT_APP_APPLE_MUSIC_DEVELOPER_TOKEN_ENDPOINT=${{ vars.APPLE_MUSIC_DEVELOPER_TOKEN_ENDPOINT }}
          REACT_APP_SOCKET_URI=${{ vars.SOCKET_URI }}
          REACT_APP_URL=${{ vars.CLIENT_URL }}
          REACT_APP_GIPHY_API_KEY=${{ vars.GIPHY_API_KEY }}
          ENVEOF
          yarn && yarn build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-build
          path: client/build

  deploy-client:
    runs-on: ubuntu-latest
    needs: ["build-client"]
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: client-build
          path: client-build
      - name: Create release directory
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: mkdir -p ${{ vars.TARGET }}/${{ github.run_id }}-${{ github.run_number }}
      - name: Rsync build output to release directory
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          REMOTE_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SOURCE: client-build/
          TARGET: ${{ vars.TARGET }}/${{ github.run_id }}-${{ github.run_number }}

  activate-client-release:
    runs-on: ubuntu-latest
    needs: ["deploy-client"]
    steps:
      - name: Update current symlink
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ vars.TARGET }}
            rm current
            ln -sv ./${{ github.run_id }}-${{ github.run_number }} current
