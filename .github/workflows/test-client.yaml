name: Test client

on:
  pull_request:

jobs:
  test-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run client unit tests
        working-directory: client
        run: |
          CI=true yarn && yarn test
