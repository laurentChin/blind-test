name: Deploy
concurrency:
  group: deploy
  cancel-in-progress: true

on:
  push:
    branches: ['master']
  workflow_dispatch:

env:
  SERVER_IMAGE: ghcr.io/laurentchin/blind-test-server

jobs:
  run-client-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run client unit tests
        working-directory: client
        run: |
          CI=true yarn && yarn test

  build-server-image:
    runs-on: ubuntu-latest
    needs: ["run-client-tests"]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: |
            ${{ env.SERVER_IMAGE }}:${{ github.sha }}
            ${{ env.SERVER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-server:
    runs-on: ubuntu-latest
    needs: ["build-server-image"]
    steps:
      - name: Pull and run server container
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/blind-test-server
            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ env.SERVER_IMAGE }}:${{ github.sha }}
            cat > .env <<ENVEOF
            PORT=${{ vars.SERVER_PORT }}
            CLIENT_URL=${{ vars.CLIENT_URL }}
            ENVEOF
            docker stop blind-test-server || true
            docker rm blind-test-server || true
            docker run -d \
              --name blind-test-server \
              --restart unless-stopped \
              --env-file .env \
              -p ${{ vars.SERVER_PORT }}:${{ vars.SERVER_PORT }} \
              ${{ env.SERVER_IMAGE }}:${{ github.sha }}
            docker image prune -f

  build-client:
    runs-on: ubuntu-latest
    needs: ["run-client-tests"]
    steps:
      - uses: actions/checkout@v4
      - name: Build client
        working-directory: client
        run: |
          cat > .env <<ENVEOF
          REACT_APP_SPOTIFY_API_ENDPONT=${{ vars.SPOTIFY_API_ENDPONT }}
          REACT_APP_SPOTIFY_AUTHORIZE_ENDPOINT=${{ vars.SPOTIFY_AUTHORIZE_ENDPOINT }}
          REACT_APP_SPOTIFY_CLIENT_ID=${{ vars.SPOTIFY_CLIENT_ID }}
          REACT_APP_SPOTIFY_TOKEN_ENDPOINT=${{ vars.SPOTIFY_TOKEN_ENDPOINT }}
          REACT_APP_SOCKET_URI=${{ vars.SOCKET_URI }}
          REACT_APP_URL=${{ vars.CLIENT_URL }}
          REACT_APP_GIPHY_API_KEY=${{ vars.GIPHY_API_KEY }}
          ENVEOF
          yarn && yarn build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-build
          path: client/build

  deploy-client:
    runs-on: ubuntu-latest
    needs: ["build-client"]
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: client-build
          path: client-build
      - name: Create release directory
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: mkdir -p ${{ vars.TARGET }}/${{ github.run_id }}-${{ github.run_number }}
      - name: Rsync build output to release directory
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          REMOTE_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SOURCE: client-build/
          TARGET: ${{ vars.TARGET }}/${{ github.run_id }}-${{ github.run_number }}

  activate-client-release:
    runs-on: ubuntu-latest
    needs: ["deploy-client"]
    steps:
      - name: Update current symlink
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ vars.TARGET }}
            rm current
            ln -sv ./${{ github.run_id }}-${{ github.run_number }} current
