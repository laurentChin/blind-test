name: Deploy server
concurrency:
  group: deploy-server
  cancel-in-progress: true

on:
  push:
    branches: ['master']
    paths: ['server/**']
  workflow_dispatch:

env:
  SERVER_IMAGE: ghcr.io/laurentchin/blind-test-server

jobs:
  build-server-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: |
            ${{ env.SERVER_IMAGE }}:${{ github.sha }}
            ${{ env.SERVER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-server:
    runs-on: ubuntu-latest
    needs: ["build-server-image"]
    steps:
      - name: Pull and run server container
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/blind-test-server
            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ env.SERVER_IMAGE }}:${{ github.sha }}
            cat > .env <<ENVEOF
            PORT=${{ vars.SERVER_PORT }}
            CLIENT_URL=${{ vars.CLIENT_URL }}
            ENVEOF
            docker stop blind-test-server || true
            docker rm blind-test-server || true
            docker run -d \
              --name blind-test-server \
              --restart unless-stopped \
              --env-file .env \
              -p ${{ vars.SERVER_PORT }}:${{ vars.SERVER_PORT }} \
              ${{ env.SERVER_IMAGE }}:${{ github.sha }}
            docker image prune -f
